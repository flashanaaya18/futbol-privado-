name: Scrape Futbol 24/7

on:
  schedule:
    # Se ejecuta de forma automática cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write  # Permite al GITHUB_TOKEN empujar cambios al repositorio

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx beautifulsoup4

    - name: Run Scraper
      run: |
        python scrape_futbol.py

    - name: Commit and Push matches.json and futbol.m3u
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add matches.json futbol.m3u
        # Solo hacer commit si alguno de los archivos cambió
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches list and IPTV playlist" && git push origin main)
